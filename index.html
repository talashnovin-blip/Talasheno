html,body{margin:0}
body{font-family:Vazirmatn,"Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif;color:var(--ink);background:var(--deco),linear-gradient(135deg,var(--g1),var(--g2) 55%,var(--g3));background-attachment:fixed;min-height:100vh;font-size:18px;line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top h1{font-size:1.1rem;margin:0}
.sp{flex:1}
.ib{width:46px;height:46px;border-radius:50%;border:0;background:var(--lav);font-size:1.25rem;cursor:pointer;flex:none;color:#3b3356}
.q{width:34px;height:34px;border-radius:50%;border:2px solid var(--acc);background:var(--solid);color:var(--acc);font-weight:700;cursor:pointer;flex:none;padding:0}
main{max-width:860px;margin:0 auto;padding:14px 12px 100px;position:relative;z-index:1}
footer{text-align:center;color:var(--ink2);font-size:.75rem;padding:0 12px 80px;position:relative;z-index:1}
h2{font-size:1.25rem;margin:.2em 0 .5em}h3{font-size:1.05rem;margin:.2em 0 .4em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:0 6px 18px #6b5ca41a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{position:relative;border-radius:var(--r);padding:16px 10px;text-align:center;cursor:pointer;border:2px solid #fff8;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#3b3356}
.tile .e{font-size:2.4rem}.tile b{font-size:1.02rem}.tile small{color:#6b6485;font-size:.78rem;line-height:1.4}
.tile .q{position:absolute;top:6px;left:6px;width:28px;height:28px;font-size:.85rem}
.c0{background:var(--mint)}.c1{background:var(--pink)}.c2{background:var(--lav)}.c3{background:var(--sky)}
.btn{min-height:48px;padding:8px 18px;border-radius:16px;border:0;background:var(--acc);color:#fff;font-weight:700;cursor:pointer}
.btn.alt{background:var(--lav);color:#3b3356}.btn.ghost{background:transparent;border:2px solid var(--acc);color:var(--acc)}.btn.danger{background:#e98a8a}
.btn.sm{min-height:38px;padding:4px 12px;font-size:.9rem}.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row.sb{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:8px}
input,select,textarea{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:14px;background:var(--solid);color:var(--ink)}
textarea{min-height:140px;resize:vertical}
label{display:block;font-size:.9rem;color:var(--ink2);margin:8px 0 2px}
.chip{padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:var(--solid);color:var(--ink);cursor:pointer;min-height:40px}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.opt{display:block;width:100%;text-align:right;min-height:56px;margin:8px 0;padding:12px 16px;border-radius:16px;border:2px solid var(--line);background:var(--solid);color:var(--ink);font-size:1.1rem;cursor:pointer}
.opt.ok{background:var(--good);border-color:#5bc795;color:#1f4d38}.opt.no{background:#ffe3e3;border-color:var(--bad);color:#6b2f2f}
.qq{font-size:1.35rem;line-height:1.9}.ex{display:block;text-align:center;font-size:1.9rem;direction:ltr;margin:6px 0}
.prog{flex:1;min-width:80px;height:12px;background:var(--line);border-radius:8px;overflow:hidden}.prog i{display:block;height:100%;background:var(--acc2);transition:width .3s}
.fc{font-size:3.6rem;text-align:center;padding:20px;background:var(--solid);color:var(--ink);border-radius:28px;min-height:200px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;cursor:pointer}

.fb{margin-top:10px;padding:12px;border-radius:14px;background:var(--lav);color:#3b3356}

#modal{position:fixed;inset:0;background:#2b224a88;display:flex;align-items:center;justify-content:center;z-index:20;padding:14px}

.mbox{background:var(--solid);color:var(--ink);border-radius:24px;padding:18px;max-width:520px;width:100%;max-height:88vh;overflow:auto}

.chart{width:100%;height:auto;color:var(--ink2)}

.tt{flex:1}

.breath{width:140px;height:140px;border-radius:50%;background:var(--mint);margin:10px auto;display:flex;align-items:center;justify-content:center;color:#3b3356;animation:br 10s ease-in-out infinite;text-align:center}

.doll{width:min(230px,66vw);aspect-ratio:1;margin:4px auto 6px;border-radius:36px;overflow:hidden;position:relative;cursor:pointer;border:3px solid #fff9;box-shadow:0 8px 20px #6b5ca433}

.tile .e .dm{margin:0 auto}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}
.dpick{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border-radius:16px;border:2px solid var(--line);background:var(--solid);color:var(--ink);cursor:pointer;font-size:.78rem;line-height:1.3;min-height:92px}
.dpick .dm{width:62px;height:62px}.dpick.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.swatch{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);cursor:pointer;padding:0}.swatch.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.bubble{background:var(--solid);border:2px solid var(--line);border-radius:18px;padding:10px 14px;margin:6px 0;text-align:center}
.node{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;margin:6px 0;background:var(--solid)}.node.lock{opacity:.55}
.chipw{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.tilegame{aspect-ratio:1;border-radius:16px;border:2px solid var(--line);background:var(--lav);font-size:1.6rem;cursor:pointer;color:#3b3356;min-height:64px}
.tilegame.open{background:var(--solid)}.tilegame.done{background:var(--good)}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
[data-motion=off] *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){.bob,.breath,.dsvg,.eyes{animation:none!important}}
.high-contrast{--ink:#111;--ink2:#222;--line:#555;--card:#fff;--solid:#fff;--acc:#4a168f;--acc2:#006b4f}.online{background:#d8f7e7;color:#145b38}.offline{background:#ffe0e0;color:#8b1f1f}
</style>
